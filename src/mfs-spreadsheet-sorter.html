<!-- Only modify this code if you understand how WordPress Plugins work. -->
<!-- See "Local Testing" and "Details of the WordPress Plugin" in the README.md -->
<script>

  // Local testing only. WP Plugin build loads JS and CSS through PHP.
  if ( window.location.protocol === 'file:'
    || window.location.hostname === 'localhost'
    || window.location.hostname === '127.0.0.1') {

    // Load CSS
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'mfs-spreadsheet-sorter.css';
    document.head.appendChild(link);

    // Load JS
    var scripts = [
      'deps/papaparse.min.js',
      'mfs-spreadsheet-sorter.js'
    ];

    // Runtime-Appended Scripts load asynchronously, but we want them loaded in order.
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = () => resolve(src);
        script.onerror = () => reject(new Error(`Failed to load script: ${src}`));
        document.body.appendChild(script);
      });
    }

    // Load Scripts in order.
    (async () => {
      for (const scriptSrc of scripts) {
        try {
          await loadScript(scriptSrc);
          console.log(`${scriptSrc} loaded successfully.`);
        } catch (err) {
          console.error(err);
          break;
        }
      }
    })();
  }
</script>
